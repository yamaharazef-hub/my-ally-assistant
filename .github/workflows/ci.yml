name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt

      # Informational only for now: the codebase inherited from upstream Jarvis
      # carries many pre-existing style warnings; kept non-blocking so CI
      # stays focused on regressions.
      - name: Lint with flake8
        continue-on-error: true
        run: flake8 --select E,W --max-line-length=140 --ignore E722,W503,W504,E128 allycli/ installer

      - name: Run unit tests
        working-directory: allycli
        run: python -m unittest discover
